			<section data-markdown >
				<textarea data-template>
					## Capital Budgeting <span class="subtitle"><br/>How to spend it?</span>

					* Companies invest in projects: Production / services / investments
					* The capital allocation decisions made by the firm’s managers must...
						- Meet their obligations and liabilities – e.g. pay off debt
						- Add value for the shareholders
					* Link to funding: Firm's target rate of return for projects should reflect…
						- the capital structure of the firm
						- the cost of borrowing of the firm
						- the firm’s tax position
						- shareholders’ required return
					* Shareholders’ return
						- Real Risk Free Rate + Anticipated Inflation + Risk Premium
						- Risk premium reflects risk of activities AND capital structure
				</textarea>
			</section>


			<section data-markdown >
				<textarea data-template>
					## Invest wisely <span class="subtitle"><br/>We need a decision rule!</span>

					* Consistency in decision making, to discipline middle management and allow delegation

					* Decision rule should account for
						- Cashflows from the project (including tax?)
						- Risks and uncertainties relating to those cashflows
						- All impacts, side effects and spillovers from the project
						- Opportunity costs for the firm
					* Correct application of the decision rule must
						- Ensure the projects accepted ADD value to the firm
						- Lead to rejection of projects that do NOT add value

				</textarea>
			</section>

			<section data-markdown >
				<textarea data-template>
					## NPV! <span class="subtitle"><br/>Corporate finance theory is clear: use Net Present Value!</span>

					* NPV = DCF &minus; purchase price

					$$ \small NPV = \sum_{t=1}^{\infty} \frac{CF_t}{(1+r_t)^t} -C_0$$


					* Alternative investment rules based on NPV should be consistent
						- Flow to Equity, Adjusted Present Value

				</textarea>
			</section>

			<section data-markdown >
				<textarea data-template>
					## Decision rules <span class="subtitle"><br/>Alternatives to NPV?</span>

					* Frequently used: Internal Rate of Return (IRR)
						- Similar to NPV: IRR is the yield at which the NPV = 0
						- Gives same YES/NO result as NPV for <emph>individual</emph> projects
						- May give “wrong” decision for competing projects
						- Is technically flawed if multiple changes of sign

					* Rule of thumb methods e.g. payback, cost ratios are flawed

				</textarea>
			</section>

			<section data-markdown >
				<textarea data-template>
				## Bonds, Equity, RE<span class="subtitle"><br/>Valuing different types of projects: Where does real estate fit in?</span>
				* Projects similar to bonds?
					- Fixed interest debt vehicle
					- Defined cashflow (amount, timing)
					- Return to maturity versus trading return
				* Or similar to equities?
					- Closed ended, public listed equity vehicle
					- Cashflow from dividend payments or sale
					- Return dependent on timing of sale, growth, etc.
				* Real estate has characteristics of bonds and equity
					- Bonds: Rental cashflow (defined by lease contract)
					- Equity: Capital growth and income growth
				</textarea>
			</section>

			<section data-markdown >
				<textarea data-template>
				## A valid comparison?<span class="subtitle"><br/>Real Estate is not like bonds and equity?</span>

				* Large lot size problem
					- Expensive to assemble portfolio
					- Almost impossible to diversify away specific risk
					- Portfolio tracking error versus index (e.g. MSCI/IPD)
				* Liquidity issues
					- Returns are ex post returns
					- Ex ante risk from illiquidity of underlying asset
					- Illiquidity compounded by high transaction costs
				* Management issues
					- High search and monitoring costs
					- Real asset requires day-to-day intervention

				</textarea>
			</section>

			<section data-markdown >
				<textarea data-template>
				## Discounted Cashflows <span class="subtitle"><br/>Value is sum of future cashflows, discounted back to today.</span>
				`$$ V_0 = \sum^\infty_{t=1} \frac{CF_t}{(1+r_t)^t} $$`

				* Easy! You have done this before.
				* How should we model the cash flows?
				* Which discount rate(s) to use?
				* Real Estate pecularities?
				</textarea>
			</section>

			<section data-markdown >-
				<textarea data-template>
				## Cash flows<span class="subtitle"><br/>Basic DCF models for equity, growing perpetuity.</span>
				* If we assume that CF is an increasing perpetuity,
					- and <emph>g</emph> is the long-run average growth rate and <emph>r</emph> is the required return for equity holders,
					- then `$ \small V_0 = \sum^{\infty}_{t=1}D_t(1+r)^{-t} $`
					- simplifies to `$ \small V = \frac{D_1}{r-g}$`.
					- (Dividend discount model / Gordon growth model)
				* Problems
					- While the (dividend) yield (d = r-g), is observable (d = D<sub>1</sub>/P), how do we estimate r and g?
					- g might change over life of firm.
					- Re-investment at same rate not always possible (typically declining returns).

				</textarea>
			</section>

			<section data-markdown >
				<textarea data-template>
				## CF Private Real Estate <span class="subtitle"><br/></span>
				* Bond-like characteristics
					- Lease contracts: defined rent and defined maturity?
				* Equity-like characteristics
					- Perpetuity: must either estimate exit value or use a perpetuity formula
					- Growth: income (and capital value) change over time
				* Capital expenditures tend to be irregular and large.
				* Optionality
				</textarea>
			</section>

			<section data-markdown >
				<textarea data-template>
				## Large Transaction costs <span class="subtitle"><br/>Round trip transaction costs as high as 7-8% for commercial RE (Collet, Lizieri & Ward, 2003)</span>

				* High round trip transaction costs
					- Marketing and search costs
					- Legal and other professional fees
					- Property taxes/stamp duties

				* Directly incorporate into cash flow predictions

				* Cannot readily trade in and out of property. Long holding periods. Liquidity risk.

			</textarea>
			</section>


			<section data-markdown >
				<textarea data-template>
				## Normative view on r<span class="subtitle"><br/>What might be the correct discount rate?</span>

				* Discount rate reflects time value of money &ndash; reward for giving up capital.
				* Compensation for risk
				* Fisher model of interest rates
					- Interest = Impatience + Anticipated Inflation + Risk = Risk Free Rate (RFR) + Risk Premium (RP)
					- RFR: From govenment debt?
					- RP depends on the variability of economic and financial drivers and "price of risk"
				* Account for depreciation of the asset in CF or r? Both possible.

				</textarea>
			</section>


			<section data-markdown >
			<textarea data-template>
			## What is (or should be) R?<span class="subtitle"><br/>Decomposing yield <emph>(k)</emph> to back out required return <emph>(r)</emph>.</span>

			<table style="font-size: 0.6em;">
			<tr><td></td><td></td></tr>
			<tr><td>k = r – g </td><td> r is required return, g = growth <br>(k is directly observable, R and g not!)</td></tr>
			<tr><td>r = RFR + RP </td><td> Risk Free Rate + Risk Premium </td></tr>
			<tr><td>RFR = RFR<sub>r</sub> + E(f) </td><td> real RFR, expected inflation </td></tr>
			<tr><td>g = g<sub>r</sub> + E(f) </td><td> real Growth, expected inflation </td></tr>
			<tr><td>k = RFR<sub>r</sub> + E(f) + RP – g<sub>r</sub> – E(f) </td><td></td></tr>
			<tr><td>k = RFR<sub>r</sub> + RP - g<sub>r</sub> </td><td> and inflation cancels out</td></tr>
			<tr><td>k = RFR<sub>r</sub> + RP – g<sub>r</sub> + d </td><td> depreciation of structures</td></tr>
			<tr><td></td><td></td></tr>
			</table>

			* If we have realistic estimates for some but not all parameters, we can back out the market consensus for anything missing.
				</textarea>
			</section>

			<section data-markdown >
				<textarea data-template>
				## empirical models<span class="subtitle"><br/>Yields as a function of location, time and quality.</span>
				* Empirical approach: regress yields against variety of explanatory variables
					- Yield = 𝑓(location, time, property characteristics)
				* Explanatory variables
					- Time dummies (monthly/quarterly/…)
					- Location controls (neighbourhood, region)
					- Property characteristics: Tenants, amenities, vintage, maintenance levels, energy consumption...
				* Fit model to property characteristics to estimate yield
				* Trade-off: Number of observations vs. time and location focus
				* Uncertainty: What is the “right” specification?
				* Fundamental challenge: Is the market value the “true” value?
					- Geltner & Goetzmann (2000): 7%-15% noise in individual NCREIF transactions
				</textarea>
			</section>

					* The comparable approach sets off from market-level yields—and then uses comparables to find value of a single asset.
